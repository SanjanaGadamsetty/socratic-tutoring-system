services:
  - type: web
    name: socratic-tutor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.api.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
